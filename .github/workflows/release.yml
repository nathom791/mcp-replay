name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (example: v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-release:
    name: Verify release versions
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.release_tag }}

    steps:
      - name: Resolve release tag
        id: resolve-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          if [[ "$TAG" != v* ]]; then
            echo "Release tag must start with 'v': $TAG"
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve-tag.outputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify tag matches app versions
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.RELEASE_TAG;
          const expected = tag.replace(/^v/, '');

          const guiPackageVersion = JSON.parse(
            fs.readFileSync('apps/gui/package.json', 'utf8'),
          ).version;
          const tauriConfigVersion = JSON.parse(
            fs.readFileSync('apps/gui/src-tauri/tauri.conf.json', 'utf8'),
          ).version;

          const cargoToml = fs.readFileSync('apps/gui/src-tauri/Cargo.toml', 'utf8');
          const cargoMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);
          if (!cargoMatch) {
            console.error('Unable to parse version from apps/gui/src-tauri/Cargo.toml');
            process.exit(1);
          }

          const checks = [
            ['apps/gui/package.json', guiPackageVersion],
            ['apps/gui/src-tauri/tauri.conf.json', tauriConfigVersion],
            ['apps/gui/src-tauri/Cargo.toml', cargoMatch[1]],
          ];

          const mismatches = checks.filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            console.error(`Release tag ${tag} does not match file versions:`);
            for (const [file, version] of mismatches) {
              console.error(`- ${file}: ${version} (expected ${expected})`);
            }
            process.exit(1);
          }

          console.log(`Release version ${expected} verified across app metadata files.`);
          NODE

  build:
    name: Bundle (${{ matrix.platform }})
    needs: verify-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact_name: tauri-linux-bundles
            artifact_path: |
              apps/gui/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/gui/src-tauri/target/release/bundle/deb/*.deb
          - platform: windows
            os: windows-2022
            bundles: nsis,msi
            artifact_name: tauri-windows-bundles
            artifact_path: |
              apps/gui/src-tauri/target/release/bundle/nsis/*.exe
              apps/gui/src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.verify-release.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve Rust toolchain version
        id: rust
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('rust-toolchain.toml', 'utf8');
            const match = content.match(/^\s*channel\s*=\s*"([^"]+)"/m);
            if (!match) {
              core.setFailed('Unable to read toolchain channel from rust-toolchain.toml');
              return;
            }
            core.setOutput('channel', match[1]);

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Print resolved tool versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gui/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bundles
        run: pnpm --filter @opencode/gui exec tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs:
      - verify-release
      - build

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA256 checksums
        run: |
          find release-artifacts -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > release-artifacts/SHA256SUMS.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.release_tag }}
          name: ${{ needs.verify-release.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/SHA256SUMS.txt
